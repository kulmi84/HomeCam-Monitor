name: Fremdprogramme-mit-Quellen

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.0-documentation]
    paths:
      - '.github/workflows/media-sources-build.yml'
      - '.github/scripts/collect-media-sources.py'

permissions:
  contents: read

concurrency:
  group: media-sources-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/shinchiro/archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shinchiro/mpv-winbuild-cmake
          ref: 05a60b3cfd04e3e3b89918f4a27f3dde2935dff2
          path: media-build
      - name: Fremdquellen laden und Hauptprojekte fixieren
        run: |
          git config --global --add safe.directory '*'
          # git am creates local patch commits; use a technical runner identity.
          git config --global user.name 'HomeCam Media Build'
          git config --global user.email 'homecam-media-build@users.noreply.github.com'
          cd media-build
          # Upstream cleanup resets patched source trees after installation.
          # Keep those exact trees so the archived sources match our binaries.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmake/custom_steps.cmake')
          s = p.read_text().replace('function(cleanup _name _last_step)', 'function(cleanup _name _last_step)\n    return() # preserve actual corresponding sources')
          p.write_text(s)
          # ftp.gnu.org is unreachable from this runner. Mirror GNU inputs,
          # including the toolchain, retaining every upstream checksum.
          for p in Path('.').rglob('*.cmake'):
              s = p.read_text()
              for prefix in ('https://ftp.gnu.org/pub/gnu/', 'https://ftp.gnu.org/gnu/'):
                  s = s.replace(prefix, 'https://mirrors.kernel.org/gnu/')
              p.write_text(s)
          for project, revision in [('mpv', '6c092d978b'), ('ffmpeg', 'a35c879992'), ('curl', '318bd978ea2d36ace36b42da2174b79c3abd89a3')]:
              p = Path(f'packages/{project}.cmake')
              s = p.read_text().replace('SOURCE_DIR ${SOURCE_LOCATION}', f'GIT_TAG {revision}\n    GIT_RESET {revision}\n    ' + 'SOURCE_DIR ${SOURCE_LOCATION}')
              p.write_text(s)
          # Static OpenSSL's symbol checks must link its compression dependencies
          # after libssl/libcrypto, rather than placing -l flags in CFLAGS.
          p = Path('packages/ngtcp2.cmake')
          s = p.read_text()
          flag_line = next(line for line in s.splitlines(True) if '-DCMAKE_C_FLAGS=' in line)
          p.write_text(s.replace(flag_line, ''))
          p = Path('packages/curl.cmake')
          s = p.read_text()
          s = s.replace(' -lz -lbrotlienc -lbrotlidec -lbrotlicommon -lzstd -lcrypt32 -lsecur32', '')
          p.write_text(s)
          PY
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DGCC_ARCH=x86-64 -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" -DRUSTUP_LOCATION="$PWD/rustup" -G Ninja -B build -S .
          ninja -C build download
          # Upstream excludes curl from the aggregate download target.
          # Fetch it explicitly before applying our source corrections.
          ninja -C build curl-download
          git -C src_packages/curl checkout 318bd978ea2d36ace36b42da2174b79c3abd89a3
          git -C src_packages/curl sparse-checkout disable
          git -C src_packages/mpv checkout 6c092d978b
          git -C src_packages/ffmpeg checkout a35c879992
          git -C src_packages/ffmpeg sparse-checkout disable
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src_packages/ngtcp2/CMakeLists.txt')
          s = p.read_text()
          needle = 'set(CMAKE_REQUIRED_LIBRARIES  "${OPENSSL_LIBRARIES}")'
          if needle not in s:
              raise RuntimeError('ngtcp2 OpenSSL symbol check changed; inspect before patching')
          libs = ('z', 'brotlienc', 'brotlidec', 'brotlicommon', 'zstd')
          extra = '\n    list(APPEND CMAKE_REQUIRED_LIBRARIES ' + ' '.join('"${CMAKE_INSTALL_PREFIX}/lib/lib' + name + '.a"' for name in libs) + ')'
          p.write_text(s.replace(needle, needle + extra))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src_packages/curl/CMakeLists.txt')
          s = p.read_text()
          needle = 'list(APPEND CMAKE_REQUIRED_LIBRARIES OpenSSL::SSL OpenSSL::Crypto)'
          if needle not in s:
              raise RuntimeError('curl OpenSSL checks changed; review required')
          libs = ('z', 'brotlienc', 'brotlidec', 'brotlicommon', 'zstd')
          extra = '\n    list(APPEND CMAKE_REQUIRED_LIBRARIES ' + ' '.join('"${CMAKE_INSTALL_PREFIX}/lib/lib' + name + '.a"' for name in libs) + ')'
          p.write_text(s.replace(needle, needle + extra))
          PY
          pacman -Q > build-environment.txt
      - name: Windows-Toolchain bauen
        run: ninja -C media-build/build gcc
      - name: mpv und FFmpeg mit Abhängigkeiten bauen
        run: ninja -C media-build/build mpv
      - name: Tatsächliche Quellen, Revisionen und Lizenztexte sammeln
        run: python3 .github/scripts/collect-media-sources.py media-build media-output
      - name: Quellen und Binaries gemeinsam zur Prüfung bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HomeCam-Media-Build-mit-Quellen
          path: media-output/
          retention-days: 30
          compression-level: 0
      - name: Buildprotokolle speichern
        if: always()
        run: |
          mkdir -p media-logs
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('media-build/build')
          for p in root.rglob('*'):
              if p.is_file() and (p.suffix == '.log' or p.name == 'CMakeConfigureLog.yaml'):
                  destination = Path('media-logs') / p.relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, destination)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeCam-Media-Buildprotokolle
          path: media-logs/
          if-no-files-found: ignore

