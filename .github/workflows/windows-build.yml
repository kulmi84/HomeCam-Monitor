name: Windows-Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Portable Windows-Version erstellen
        run: dotnet publish HomeCamMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Beta mit Bewegungserkennung erstellen
        run: dotnet publish HomeCamMonitor.Beta.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-beta
      - name: Bedienleiste, Fensterposition und Einstellungen prüfen
        run: dotnet run --project tests/ToolbarRender/ToolbarRender.csproj -c Release -- "${{ runner.temp }}/toolbar-render"
      - name: mpv Video-Engine laden
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'dev' } | Select-Object -First 1
          if (-not $asset) { throw 'Kein passendes mpv-Windows-Paket gefunden.' }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv -y
          $exe = Get-ChildItem mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'mpv.exe wurde im Paket nicht gefunden.' }
          Copy-Item $exe.FullName publish/mpv.exe
          Copy-Item $exe.FullName publish-beta/mpv.exe
      - name: FFmpeg für Bewegungsaufnahmen laden
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Kein LGPL-FFmpeg-Windows-Paket gefunden.' }
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $exe = Get-ChildItem ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe wurde im Paket nicht gefunden.' }
          Copy-Item $exe.FullName publish-beta/ffmpeg.exe
          $license = Get-ChildItem ffmpeg -File -Recurse | Where-Object { $_.Name -match '^LICENSE' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName publish-beta/FFmpeg-LICENSE.txt }
      - name: Video und Snapshot mit FFmpeg erzeugen und lesen
        shell: pwsh
        run: |
          $ffmpeg = (Resolve-Path publish-beta/ffmpeg.exe).Path
          $source = Join-Path $env:RUNNER_TEMP 'homecam-source.mkv'
          $recorded = Join-Path $env:RUNNER_TEMP 'homecam-recorded.mkv'
          $snapshot = Join-Path $env:RUNNER_TEMP 'homecam-snapshot.png'
          & $ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i 'testsrc=size=320x180:rate=10' -t 2 -c:v mpeg4 -y $source
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg-Testquelle fehlgeschlagen.' }
          & $ffmpeg -nostdin -hide_banner -loglevel error -i $source -t 1 -map 0:v:0 -an -c:v copy -f matroska -y $recorded
          if ($LASTEXITCODE -ne 0 -or (Get-Item $recorded).Length -lt 4096) { throw 'Bewegungsaufnahme fehlgeschlagen.' }
          & $ffmpeg -nostdin -hide_banner -loglevel error -i $recorded -f null NUL
          if ($LASTEXITCODE -ne 0) { throw 'Die erzeugte Videodatei ist nicht lesbar.' }
          & $ffmpeg -nostdin -hide_banner -loglevel error -i $source -map 0:v:0 -frames:v 1 -an -f image2 -y $snapshot
          if ($LASTEXITCODE -ne 0 -or (Get-Item $snapshot).Length -lt 64) { throw 'Snapshot fehlgeschlagen.' }
          & $ffmpeg -nostdin -hide_banner -loglevel error -i $snapshot -f null NUL
          if ($LASTEXITCODE -ne 0) { throw 'Der erzeugte Snapshot ist nicht lesbar.' }
      - name: Beta-Downloads erstellen
        shell: pwsh
        run: .github/scripts/build-beta-downloads.ps1 -Version '0.3.0-beta.11'
      - name: Downloads mit Microsoft Defender prüfen
        shell: pwsh
        run: .github/scripts/scan-downloads.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCamMonitor-v0.1.2-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCamMonitor-Beta-v0.3.0-beta.11-win-x64
          path: beta-downloads/
